name: stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [scripts/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build.py
        env:
          # STATS_TOKEN is optional: a PAT makes private contributions count toward the streak
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Update stats" && git push)
