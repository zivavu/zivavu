<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170" width="380" height="170" role="img" aria-label="157 day contribution streak">
  <title>157 day streak, longest 157, 2,456 contributions in the last 12 months</title>
  <style>
    .label { font: 600 11px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #7d8590; }
    .live { font: 600 11px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #7d8590; fill: #3ddc97; }
    .num { font: 800 76px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: -3px; }
    .sub { font: 500 14px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #e6edf3; }
    .note { font: 400 12px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #7d8590; }
    .dot { fill: #3ddc97; animation: blink 1.6s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }

    /* RGB-split copies of the number that sit slightly apart and jump around every 7s */
    .cyan { fill: #19d3f3; mix-blend-mode: screen; transform: translate(-2px, 0); animation: cyan 7s steps(1) infinite; }
    .red { fill: #ff2d6f; mix-blend-mode: screen; transform: translate(2px, 0); animation: red 7s steps(1) infinite; }
    .base { fill: #e6edf3; animation: base 7s steps(1) infinite; }
    @keyframes cyan {
      0%, 100% { transform: translate(-2px, 0); }
      90% { transform: translate(-8px, 1px); }
      92% { transform: translate(5px, -1px); }
      94% { transform: translate(-4px, 2px); }
      96% { transform: translate(-2px, 0); }
    }
    @keyframes red {
      0%, 100% { transform: translate(2px, 0); }
      90% { transform: translate(9px, -1px); }
      92% { transform: translate(-6px, 1px); }
      94% { transform: translate(3px, -2px); }
      96% { transform: translate(2px, 0); }
    }
    @keyframes base {
      0%, 100% { opacity: 1; }
      90% { opacity: 0.55; }
      93% { opacity: 0.85; }
      96% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <text id="num" x="0" y="112" class="num">157</text>
  </defs>

  <text x="0" y="20" class="label">STREAK</text>
  <circle cx="312" cy="16" r="3.5" class="dot"/>
  <text x="380" y="20" class="live" text-anchor="end">LIVE</text>
  <use href="#num" class="cyan"/>
  <use href="#num" class="red"/>
  <use href="#num" class="base"/>
  <text x="2" y="140" class="sub">days in a row</text>
  <text x="2" y="164" class="note">longest 157 · 2,456 contributions in 12 months</text>
</svg>
