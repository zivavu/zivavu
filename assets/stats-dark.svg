  <circle cx="312" cy="16" r="3.5" class="dot"/>
  <text x="380" y="20" class="live" text-anchor="end">LIVE</text>
  <use href="#num" class="num-cyan"/>
  <use href="#num" class="num-red"/>
  <use href="#num" class="num-base"/>
  <text x="2" y="140" class="sub">days in a row</text>
  <text x="2" y="164" class="note">longest 157 · 2,454 contributions in 12 months</text>

  <line x1="405" y1="6" x2="405" y2="170" stroke="#30363d"/>

  <text x="430" y="20" class="label">LANGUAGES</text>
