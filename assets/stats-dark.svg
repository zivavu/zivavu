<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 176" width="800" height="176" role="img" aria-label="159 day contribution streak and top languages">
  <title>159 day streak, longest 159, 2,485 contributions in the last 12 months</title>
  <style>
    .label { font: 600 11px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #7d8590; }
    .num { font: 800 76px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing: -3px; }
    .sub { font: 500 14px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #e6edf3; }
    .note { font: 400 12px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #7d8590; }
    .lang { font: 500 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #e6edf3; }
    .pct { font: 400 12px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #7d8590; }

    /* RGB-split copies of the number that sit slightly apart and jump around every 7s */
    .cyan { fill: #19d3f3; mix-blend-mode: screen; transform: translate(-2px, 0); animation: cyan 7s steps(1) infinite; }
    .red { fill: #ff2d6f; mix-blend-mode: screen; transform: translate(2px, 0); animation: red 7s steps(1) infinite; }
    .base { fill: #e6edf3; animation: base 7s steps(1) infinite; }
    @keyframes cyan {
      0%, 100% { transform: translate(-2px, 0); }
      90% { transform: translate(-8px, 1px); }
      92% { transform: translate(5px, -1px); }
      94% { transform: translate(-4px, 2px); }
      96% { transform: translate(-2px, 0); }
    }
    @keyframes red {
      0%, 100% { transform: translate(2px, 0); }
      90% { transform: translate(9px, -1px); }
      92% { transform: translate(-6px, 1px); }
      94% { transform: translate(3px, -2px); }
      96% { transform: translate(2px, 0); }
    }
    @keyframes base {
      0%, 100% { opacity: 1; }
      90% { opacity: 0.55; }
      93% { opacity: 0.85; }
      96% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <text id="num" x="0" y="112" class="num">159</text>
    <clipPath id="bar"><rect x="430" y="40" width="370" height="10" rx="5"/></clipPath>
  </defs>

  <text x="0" y="20" class="label">STREAK</text>
  <use href="#num" class="cyan"/>
  <use href="#num" class="red"/>
  <use href="#num" class="base"/>
  <text x="2" y="140" class="sub">days in a row</text>
  <text x="2" y="164" class="note">longest 159 · 2,485 contributions in 12 months</text>

  <line x1="405" y1="6" x2="405" y2="170" stroke="#30363d"/>

  <text x="430" y="20" class="label">LANGUAGES</text>
  <rect x="430" y="40" width="370" height="10" rx="5" fill="#30363d"/>
  <g clip-path="url(#bar)"><rect x="430.0" y="40" width="273.3" height="10" fill="#3178c6"/><rect x="705.3" y="40" width="74.4" height="10" fill="#ff3e00"/><rect x="781.6" y="40" width="6.7" height="10" fill="#f1e05a"/><rect x="790.4" y="40" width="4.3" height="10" fill="#e34c26"/><rect x="796.7" y="40" width="3.2" height="10" fill="#3572a5"/><rect x="801.9" y="40" width="3.2" height="10" fill="#5686a5"/></g>
  <circle cx="435" cy="80" r="5" fill="#3178c6"/><text x="448" y="84" class="lang">TypeScript</text><text x="610" y="84" class="pct" text-anchor="end">73.9%</text><circle cx="625" cy="80" r="5" fill="#ff3e00"/><text x="638" y="84" class="lang">Svelte</text><text x="800" y="84" class="pct" text-anchor="end">20.1%</text><circle cx="435" cy="110" r="5" fill="#f1e05a"/><text x="448" y="114" class="lang">JavaScript</text><text x="610" y="114" class="pct" text-anchor="end">1.8%</text><circle cx="625" cy="110" r="5" fill="#e34c26"/><text x="638" y="114" class="lang">HTML</text><text x="800" y="114" class="pct" text-anchor="end">1.2%</text><circle cx="435" cy="140" r="5" fill="#3572a5"/><text x="448" y="144" class="lang">Python</text><text x="610" y="144" class="pct" text-anchor="end">0.9%</text><circle cx="625" cy="140" r="5" fill="#5686a5"/><text x="638" y="144" class="lang">GLSL</text><text x="800" y="144" class="pct" text-anchor="end">0.9%</text>
</svg>
